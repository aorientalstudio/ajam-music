<title>إدارة الطلاب · AJAM MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Reem+Kufi:wght@600;700&display=swap">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2430;--ink2:#4b5563;--mut:#8a8f98;--line:#e8e2d6;--line2:#f1ece2;
  --gold:#b8862b;--gold2:#e8b44c;--goldbg:#fbf3e2;--green:#1f8a52;--greenbg:#e5f4e9;--red:#c0392b;--redbg:#fbeaea;
  --amber:#b7791f;--amberbg:#fdf3dc;--blue:#2f6fb5;--bluebg:#e7f0fa;--violet:#6d4fc2;--violetbg:#efeafd;
  --f:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;--sh:0 1px 2px rgba(30,24,10,.05),0 6px 20px rgba(30,24,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---- login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:28px 26px}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.logos img{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold2)}
.logos .x{color:var(--mut);font-weight:600}
.lcard h1{margin:4px 0 2px;text-align:center;font:700 22px "Reem Kufi",var(--f)}
.lcard p{margin:0 0 18px;text-align:center;color:var(--mut);font-size:13.5px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(232,180,76,.2)}
.inp.ltr{direction:ltr;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:#faf7f0;border-color:#dccfb3}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c3646}
.btn.gold{background:var(--gold2);border-color:var(--gold2);color:#2a1c05}
.btn.gold:hover{background:#efc061}
.btn.danger{color:var(--red);border-color:#efc9c4}
.btn.danger:hover{background:var(--redbg)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.wide{width:100%;padding:11px}
.err{color:var(--red);font-size:13px;min-height:20px;margin:6px 0 0;text-align:center}

/* ---- app shell */
.top{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px var(--gold2)}
.brand b{font:700 17px "Reem Kufi",var(--f);display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:12px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.who{font-size:12.5px;color:var(--mut)}
main{max-width:1360px;margin:0 auto;padding:18px 20px 60px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font:700 26px/1.2 var(--f);margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:1px}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--k,var(--gold2))}
.kpi.warn .v{color:var(--red)}

.alerts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.alert{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.alert h3{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.alert h3 i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px}
.alert ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:132px;overflow:auto}
.alert li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 6px;border-radius:7px;cursor:pointer}
.alert li:hover{background:var(--line2)}
.alert li span:last-child{color:var(--mut);font-size:12px;white-space:nowrap}
.alert .none{color:var(--mut);font-size:12.5px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{padding-inline-start:34px}
.search::before{content:"";position:absolute;inset-inline-start:11px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid var(--mut);border-radius:50%;opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--goldbg);border-color:var(--gold2);color:#6b4a0c}
.count{color:var(--mut);font-size:12.5px;margin-inline-start:auto}

.tbl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:clip}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
th{font-size:11.5px;color:var(--mut);font-weight:700;background:#fcfaf6;position:sticky;top:var(--topH,61px);z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
th.s::after{content:" ▾";color:var(--gold)}th.s.asc::after{content:" ▴"}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:#fcf8ef}
tbody tr:last-child td{border-bottom:0}
.nm{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;position:relative}
.av.on::after{content:"";position:absolute;bottom:-1px;inset-inline-end:-1px;width:10px;height:10px;border-radius:50%;background:#2fbf68;border:2px solid #fff}
.nm b{display:block;font-weight:600;line-height:1.25}
.nm small{color:var(--mut);font-size:12px;direction:ltr;unicode-bidi:isolate}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-ok{background:var(--greenbg);color:var(--green)}.t-off{background:#eef0f3;color:#5b6472}.t-end{background:var(--redbg);color:var(--red)}
.t-soon{background:var(--amberbg);color:var(--amber)}.t-adm{background:var(--violetbg);color:var(--violet)}
.t-idle{background:var(--redbg);color:var(--red)}
.course{font-size:12.5px;font-weight:600}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter .trk{flex:1;height:7px;border-radius:99px;background:#f0ebe1;overflow:hidden;display:flex}
.meter .p{background:var(--green)}.meter .a{background:#e9c46a}
.meter em{font-style:normal;font-size:12px;color:var(--ink2);width:34px;text-align:end}
.sub{color:var(--mut);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}

/* ---- drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,12,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(760px,100%);background:var(--bg);z-index:41;box-shadow:-20px 0 50px rgba(0,0,0,.15);transform:translateX(-102%);transition:transform .25s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-102%)}
.drawer.on{transform:none!important}
.dh{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dh .av{width:52px;height:52px;font-size:19px}
.dh h2{margin:0;font-size:19px}
.dh .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--ink2);align-items:center}
.dh .x{margin-inline-start:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:4px 8px;border-radius:8px}
.dh .x:hover{background:var(--line2)}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.db{flex:1;overflow:auto;padding:16px 20px 40px;display:grid;gap:14px;align-content:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.box h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.box h3 small{color:var(--mut);font-weight:500;font-size:12px;margin-inline-start:auto}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini div{background:#fcfaf6;border:1px solid var(--line2);border-radius:10px;padding:9px 11px}
.mini b{display:block;font-size:19px}
.mini span{font-size:11.5px;color:var(--mut);font-weight:600}
.chart{width:100%;height:150px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.songs td,.songs th{padding:8px 8px;font-size:12.5px}
.songs th{position:static;cursor:default}
.hb{display:inline-flex;gap:4px;flex-wrap:wrap}
.hb span{background:var(--redbg);color:#8a2a20;border-radius:7px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.hb span.mid{background:var(--amberbg);color:#7a5210}
.ses{display:grid;gap:6px}
.ses .r{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;font-size:12.5px}
.ses .r.idle{background:#fff7f6;border-color:#f1d2cd}
.ses .t{font-weight:600}
.ses .songs2{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev{display:grid;gap:3px;font-size:12.5px;max-height:220px;overflow:auto}
.ev div{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.ev time{color:var(--mut);width:118px;flex:none}
.dev{display:flex;flex-wrap:wrap;gap:6px}
.dev span{background:#f3f0e9;border-radius:8px;padding:3px 9px;font-size:12px}

/* ---- modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(20,18,12,.4)}
.mcard{width:min(460px,100%);background:var(--card);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:20px 22px;max-height:94vh;overflow:auto}
.mcard h3{margin:0 0 4px;font-size:17px}
.mcard p.d{margin:0 0 14px;color:var(--mut);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{display:flex;gap:6px}.pw .inp{flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.cred{background:#fcfaf6;border:1px dashed var(--gold2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.9;white-space:pre-wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--red)}
.loading{opacity:.55;pointer-events:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.alerts{grid-template-columns:1fr}}
@media (max-width:760px){
  main{padding:12px 12px 50px}.topin{padding:8px 12px;gap:8px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi .v{font-size:21px}
  thead{display:none}table,tbody,tr,td{display:block;width:100%}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;border-bottom:1px solid var(--line2)}
  td{border:0;padding:0}td[data-k=name]{grid-column:1/-1}td[data-k=meter]{grid-column:1/-1}
  td[data-k=course]::before,td[data-k=last]::before,td[data-k=open]::before,td[data-k=days]::before,td[data-k=logins]::before{content:attr(data-l)": ";color:var(--mut);font-size:11.5px}
  .mini{grid-template-columns:repeat(2,minmax(0,1fr))}.ses .r{grid-template-columns:1fr auto}.ses .songs2{grid-column:1/-1}
  .row2{grid-template-columns:1fr}
}
@media print{.top,.acts,.bar,.alerts{display:none}}
</style>
</head>

<script>
"use strict";
const SB={"url": "https://cjmjhhpfjfooyuzrymec.supabase.co", "key": "sb_publishable_e7N4krZCHSStiJfs07WL1w_5oJdDg1x", "domain": "ajam.app"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COURSES=["أورغ","كمان","جيتار","قانون","عود"];
const CCOL={"أورغ":"#b8862b","كمان":"#8e3b46","جيتار":"#2f6fb5","قانون":"#1f8a52","عود":"#6d4fc2"};
let S=null, DAYS=30, DATA=null, SORT={k:"open",asc:false}, F={q:"",course:"",state:""};

/* ---------- auth ---------- */
const KEY="ajam.manage";
function save(){ try{ S?sessionStorage.setItem(KEY,JSON.stringify(S)):sessionStorage.removeItem(KEY); }catch(e){} }
async function auth(body,grant){
  const r=await fetch(SB.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw Object.assign(new Error(j.error_description||j.msg||"login"),{status:r.status}); return j;
}
async function refresh(){ const j=await auth({refresh_token:S.rt},"refresh_token"); S.at=j.access_token; S.rt=j.refresh_token; S.exp=Date.now()+j.expires_in*1000; save(); }
async function rpc(fn,args){
  if(!S) throw new Error("auth"); if(Date.now()>S.exp-60000) await refresh().catch(()=>{});
  let r=await fetch(SB.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+S.at,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  if(r.status===401){ await refresh(); r=await fetch(SB.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+S.at,"Content-Type":"application/json"},body:JSON.stringify(args||{})}); }
  const j=await r.json().catch(()=>null);
  if(!r.ok){ if(r.status===401){ logout("انتهت الجلسة، ادخل كمان مرة"); } throw new Error((j&&(j.message||j.msg))||("HTTP "+r.status)); }
  if(j&&j.reason==="role"){ logout("هاد الحساب مش حساب معلّم/مدير"); throw new Error("role"); }
  return j;
}
$("lf").onsubmit=async e=>{
  e.preventDefault(); $("lerr").textContent=""; $("lgo").disabled=true;
  const u=$("lu").value.trim().toLowerCase();
  try{
    const j=await auth({email:(u.includes("@")?u:u+"@"+SB.domain),password:$("lp").value},"password");
    S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,u:u.split("@")[0]}; save();
    const ok=await rpc("mg_ok"); if(ok!==true){ logout("هاد الحساب مش حساب معلّم/مدير"); return; }
    $("lp").value=""; enter();
  }catch(err){ $("lerr").textContent=err.status===400?"اسم المستخدم أو كلمة السر غلط":(err.message==="role"?$("lerr").textContent:"ما في اتصال بالسيرفر"); }
  finally{ $("lgo").disabled=false; }
};
function logout(msg){ S=null; save(); $("vApp").hidden=true; $("vLogin").hidden=false; closeDrawer(); $("lerr").textContent=msg||""; }
$("out").onclick=()=>logout();

/* ---------- helpers ---------- */
const fmtMin=m=>{ m=+m||0; if(m<1) return m>0?"<1 د":"0"; if(m<60) return Math.round(m)+" د"; const h=Math.floor(m/60), r=Math.round(m%60); return h+" س"+(r?" "+r+" د":""); };
const rel=t=>{ if(!t) return "ولا مرة"; const d=(Date.now()-new Date(t))/1000; if(d<90) return "هلأ"; if(d<3600) return "قبل "+Math.round(d/60)+" د"; if(d<86400) return "قبل "+Math.round(d/3600)+" س";
  const n=Math.round(d/86400); return n===1?"مبارح":n<30?"قبل "+n+" يوم":new Date(t).toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short",year:"numeric"}); };
const dt=t=>new Date(t).toLocaleString("ar-EG-u-nu-latn",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const dDays=d=>d?Math.ceil((new Date(d+"T23:59:59")-Date.now())/864e5):null;
const initials=s=>{ const p=String(s||"?").trim().split(/\s+/); return (p[0]||"?").slice(0,1)+(p[1]?p[1].slice(0,1):""); };
const avCol=s=>{ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 42% 46%)`; };
function status(s){
  if(s.role==="admin") return {k:"adm",t:"معلّم",o:0};
  if(!s.active) return {k:"off",t:"موقوف",o:4};
  const dd=dDays(s.until); if(dd!=null&&dd<0) return {k:"end",t:"انتهى الاشتراك",o:3};
  if(dd!=null&&dd<=14) return {k:"soon",t:"بيخلص بعد "+dd+" يوم",o:2};
  return {k:"ok",t:"فعّال",o:1};
}
const ratio=s=>{ const o=Math.max(+s.open||0,+s.act||0); return o>0?Math.min(1,(+s.play||0)/o):0; };
function toast(m,bad){ const t=$("toast"); t.textContent=m; t.className="toast on"+(bad?" bad":""); clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2600); }
function genPw(){ const a="abcdefghjkmnpqrstuvwxyz", d="23456789"; let s=""; const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  for(let i=0;i<5;i++) s+=a[r(a.length)]; s=s[0].toUpperCase()+s.slice(1); for(let i=0;i<4;i++) s+=d[r(d.length)]; return s; }

/* ---------- load + render ---------- */
const topH=()=>document.documentElement.style.setProperty("--topH",document.querySelector(".top").offsetHeight+"px"); addEventListener("resize",topH);
async function enter(){ $("vLogin").hidden=true; $("vApp").hidden=false; topH(); $("who").textContent=S.u; await load(); }
async function load(){
  document.body.classList.add("loading");
  try{ const j=await rpc("mg_overview",{p_days:DAYS}); if(!j||!j.ok) throw new Error("data"); DATA=j.students; render(); }
  catch(e){ if(e.message!=="role") toast("ما زبط تحميل البيانات: "+e.message,true); }
  finally{ document.body.classList.remove("loading"); }
}
$("reload").onclick=load;
$("period").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; DAYS=+b.dataset.d; $("period").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); load(); if(cur) openStudent(cur); };

function kpi(l,v,s,col,cls){ return `<div class="kpi ${cls||""}" style="--k:${col}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`; }
function render(){
  const st=DATA.filter(s=>s.role!=="admin"), act=st.filter(s=>status(s).k==="ok"||status(s).k==="soon");
  const prac=st.filter(s=>s.play>=1), playSum=st.reduce((a,s)=>a+(+s.play||0),0), openSum=st.reduce((a,s)=>a+Math.max(+s.open||0,+s.act||0),0);
  const idleS=st.reduce((a,s)=>a+(+s.idle||0),0), soon=st.filter(s=>status(s).k==="soon"||status(s).k==="end");
  $("kpis").innerHTML=
    kpi("طلاب فعّالين",act.length,"من "+st.length+" حساب","#1f8a52")+
    kpi("تدرّبوا بالفترة",prac.length,act.length?Math.round(prac.length/act.length*100)+"% من الفعّالين":"","#2f6fb5")+
    kpi("وقت عزف",fmtMin(playSum),"مجموع كل الطلاب","#b8862b")+
    kpi("معدّل للطالب",fmtMin(prac.length?playSum/prac.length:0),"عزف، للي تدرّبوا","#6d4fc2")+
    kpi("عزف من وقت البرنامج",(openSum?Math.round(playSum/openSum*100):0)+"%","الباقي فتح بدون عزف","#e9c46a")+
    kpi("جلسات بدون عزف",idleS,"دخل وقعد وما عزف","#c0392b",idleS?"warn":"");
  const notPrac=act.filter(s=>!s.last_practice||(Date.now()-new Date(s.last_practice))/864e5>=7).sort((a,b)=>new Date(a.last_practice||0)-new Date(b.last_practice||0));
  const idle=st.filter(s=>s.idle>0).sort((a,b)=>b.idle-a.idle);
  const li=(arr,f)=>arr.length?"<ul>"+arr.slice(0,30).map(s=>`<li data-id="${s.id}"><span>${esc(s.name||s.u)}</span><span>${f(s)}</span></li>`).join("")+"</ul>":'<div class="none">ما في ✓</div>';
  $("alerts").innerHTML=
    `<div class="alert"><h3><i style="background:var(--amberbg);color:var(--amber)">⏸</i>ما تدرّب من أسبوع أو أكثر <small class="sub">(${notPrac.length})</small></h3>${li(notPrac,s=>s.last_practice?rel(s.last_practice):"ولا مرة")}</div>`+
    `<div class="alert"><h3><i style="background:var(--redbg);color:var(--red)">⌛</i>دخل بدون ما يعزف (تضييع وقت) <small class="sub">(${idle.length})</small></h3>${li(idle,s=>s.idle+" مرة · "+Math.round((1-ratio(s))*100)+"% بدون عزف")}</div>`+
    `<div class="alert"><h3><i style="background:var(--violetbg);color:var(--violet)">📅</i>اشتراك بيخلص أو خلص <small class="sub">(${soon.length})</small></h3>${li(soon.sort((a,b)=>dDays(a.until)-dDays(b.until)),s=>{ const d=dDays(s.until); return d<0?"خلص من "+(-d)+" يوم":"بعد "+d+" يوم"; })}</div>`;
  $("alerts").querySelectorAll("li[data-id]").forEach(l=>l.onclick=()=>openStudent(l.dataset.id));
  // filters

function aggregate(rows){
  // sessions (one open of the app), days, songs + their hard bars
  const ses={}, days={}, songs={};
  rows.forEach(x=>{ const o=Math.max(+x.open||0,+x.act||0), p=+x.play||0;
    const s=ses[x.sid]=ses[x.sid]||{sid:x.sid,at:x.at,end:x.upd,open:0,play:0,keys:0,songs:new Set(),dev:x.dev};
    if(x.at<s.at) s.at=x.at; if(x.upd>s.end) s.end=x.upd; s.open+=o; s.play+=p; s.keys+=+x.keys||0; s.songs.add(x.title);
    const d=x.at.slice(0,10); days[d]=days[d]||{o:0,p:0}; days[d].o+=o; days[d].p+=p;
    const g=songs[x.song]=songs[x.song]||{title:x.title,kind:x.kind,o:0,p:0,plays:0,slow:0,loop:0,wok:0,wbad:0,b:{},r:{},w:{},last:x.upd};
    g.o+=o; g.p+=p; g.plays+=+x.plays||0; g.slow+=+x.slow||0; g.loop+=+x.loop||0; g.wok+=+x.wok||0; g.wbad+=+x.wbad||0; if(x.upd>g.last) g.last=x.upd;
    const B=x.bars||{}; [["b","b"],["r","r"],["w","w"]].forEach(([k])=>Object.entries(B[k]||{}).forEach(([bar,v])=>{ g[k][bar]=(g[k][bar]||0)+(+v||0); })); });
  Object.values(songs).forEach(g=>{ const sc={}; ["b","r","w"].forEach(k=>Object.entries(g[k]).forEach(([bar,v])=>{ sc[bar]=(sc[bar]||0)+v*(k==="b"?1:k==="r"?10:5); }));
    g.hard=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,3).filter(b=>sc[b]>=20).map(b=>({bar:b,sec:g.b[b]||0,r:g.r[b]||0,w:g.w[b]||0}));
    g.rep=Object.values(g.r).reduce((a,v)=>a+v,0); });
  Object.values(ses).forEach(s=>{ s.idle=s.open>=3&&s.play<s.open*.15&&s.keys<30; });
  return {ses:Object.values(ses).sort((a,b)=>b.at.localeCompare(a.at)),days,songs:Object.values(songs).sort((a,b)=>b.o-a.o)};
}
function dayChart(days){
  const N=Math.min(DAYS,60), W=700, H=150, P=22, bw=(W-P)/N, out=[]; let mx=5;
  for(let i=N-1;i>=0;i--){ const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10), v=days[d]||{o:0,p:0}; out.push([d,v]); mx=Math.max(mx,v.o); }
  const y=v=>H-P-(v/mx)*(H-P-8);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="دقائق كل يوم">`;
  [0,.5,1].forEach(f=>{ const yy=y(mx*f); g+=`<line x1="${P}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#eee6d6"/><text x="${P-4}" y="${yy+4}" font-size="10" fill="#9a9a9a" text-anchor="end">${Math.round(mx*f)}</text>`; });
  out.forEach(([d,v],i)=>{ const x=P+i*bw+bw*.15, w=bw*.7; if(v.o>0){ g+=`<rect x="${x}" y="${y(v.o)}" width="${w}" height="${y(0)-y(v.o)}" rx="2" fill="#efd9a3"><title>${d}: بالبرنامج ${fmtMin(v.o)}</title></rect>`; }
    if(v.p>0) g+=`<rect x="${x}" y="${y(v.p)}" width="${w}" height="${y(0)-y(v.p)}" rx="2" fill="#1f8a52"><title>${d}: عزف ${fmtMin(v.p)}</title></rect>`;
    if(N<=31&&(i%Math.ceil(N/10)===0)) g+=`<text x="${x+w/2}" y="${H-6}" font-size="10" fill="#9a9a9a" text-anchor="middle">${+d.slice(8)}/${+d.slice(5,7)}</text>`; });
  return g+"</svg>";
}

    if(!name){ $("me").textContent="اكتب الاسم"; return; } if(!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(u)){ $("me").textContent="اسم المستخدم: 3 حروف إنجليزي أو أكثر، بدون فراغات"; return; }
    if(pw.length<8){ $("me").textContent="كلمة السر 8 حروف أو أكثر"; return; }
    $("ms").disabled=true;
    try{ const r=await rpc("mg_create",{p_username:u,p_password:pw,p_full_name:name,p_course:$("fc").value,p_until:$("fu").value||null,p_role:"student"});
      if(!r.ok){ $("me").textContent=r.msg||"ما زبط"; $("ms").disabled=false; return; } showCred("انفتح الحساب ✓",u,pw,name); load(); }
    catch(e){ $("me").textContent="ما زبط: "+e.message; $("ms").disabled=false; } };
};

/* ---------- start ---------- */
try{ S=JSON.parse(sessionStorage.getItem(KEY)||"null"); }catch(e){ S=null; }
if(S&&S.rt) rpc("mg_ok").then(ok=>ok===true?enter():logout()).catch(()=>logout());
</script>
